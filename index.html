<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Howdy — Search for leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #FFFFFF;
    --bg-nav: #FAF9F7;
    --bg-card: #FAF9F7;
    --bg-chip: rgba(33, 33, 33, 0.05);
    --bg-chip-hover: #E6E6E6;
    --bg-pill: #FFFFFF;
    --bg-pill-hover: rgba(33, 33, 33, 0.05);
    --text-primary: #212121;
    --text-secondary: #6B6A65;
    --text-tertiary: #9A998F;
    --border-tertiary: rgba(0, 0, 0, 0.07);
    --border-secondary: rgba(0, 0, 0, 0.14);
    --accent: #5B5BF5;
    --accent-hover: #4A4ADD;
    --nav-active-bg: #F1EFE7;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --radius-xl: 20px;

    --nav-width: 240px;
    --right-width: 360px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-page);
    color: var(--text-primary);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── APP SHELL ──────────────────────────────────────────────── */
  .app {
    display: grid;
    grid-template-columns: var(--nav-width) 1fr;
    min-height: 100vh;
  }

  /* ─── LEFT NAV ───────────────────────────────────────────────── */
  .nav {
    background: var(--bg-nav);
    border-right: 0.5px solid var(--border-tertiary);
    display: flex;
    flex-direction: column;
    padding: 24px 16px;
    position: sticky;
    top: 0;
    height: 100vh;
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 8px 24px;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.02em;
  }
  .nav-logo .logo-mark {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .nav-logo .logo-mark svg { width: 22px; height: 22px; }

  .nav-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 12px;
    border-radius: var(--radius-md);
    font-size: 14px;
    color: var(--text-secondary);
    cursor: pointer;
    user-select: none;
    transition: background 0.1s, color 0.1s;
    text-decoration: none;
  }
  .nav-item:hover { background: rgba(0, 0, 0, 0.03); color: var(--text-primary); }
  .nav-item.active {
    background: var(--nav-active-bg);
    color: var(--text-primary);
    font-weight: 500;
  }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  .nav-item .label { flex: 1; }
  .nav-item .badge {
    background: rgba(0, 0, 0, 0.05);
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 600;
    padding: 1px 7px;
    border-radius: 999px;
  }

  .nav-extension {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: var(--radius-md);
    margin-top: 8px;
    cursor: pointer;
    color: var(--text-secondary);
  }
  .nav-extension:hover { background: rgba(0, 0, 0, 0.03); color: var(--text-primary); }
  .nav-extension img,
  .nav-extension .chrome-icon {
    width: 18px;
    height: 18px;
  }
  .chrome-icon {
    border-radius: 50%;
    background: conic-gradient(from 0deg, #EA4335 0deg 120deg, #FBBC05 120deg 240deg, #34A853 240deg 360deg);
    position: relative;
    flex-shrink: 0;
  }
  .chrome-icon::after {
    content: '';
    position: absolute;
    inset: 30%;
    background: #4285F4;
    border-radius: 50%;
    border: 2px solid var(--bg-nav);
  }

  .nav-footer {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: var(--radius-md);
    cursor: pointer;
  }
  .nav-footer:hover { background: rgba(0, 0, 0, 0.03); }
  .nav-footer .avatar-circle {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #D7C9B5;
    color: #5A4530;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 13px;
    flex-shrink: 0;
  }
  .nav-footer .name {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
  }
  .nav-footer .chev {
    font-size: 10px;
    color: var(--text-tertiary);
  }

  /* ─── MAIN AREA ──────────────────────────────────────────────── */
  .main {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .topbar {
    padding: 22px 40px 18px;
    font-size: 15px;
    color: var(--text-primary);
    border-bottom: 0.5px solid var(--border-tertiary);
  }

  .workarea {
    padding: 32px 40px 64px;
    display: grid;
    grid-template-columns: 1fr var(--right-width);
    gap: 32px;
    align-items: start;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
  }

  .builder { min-width: 0; }
  .side {
    position: sticky;
    top: 24px;
  }

  @media (max-width: 1100px) {
    .workarea { grid-template-columns: 1fr; }
    .side { position: static; }
  }

  /* ─── GROUPS ─────────────────────────────────────────────────── */
  .groups {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .or-between-groups {
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text-tertiary);
    padding: 4px 0;
    position: relative;
  }
  .or-between-groups::before,
  .or-between-groups::after {
    content: '';
    position: absolute;
    top: 50%;
    width: calc(50% - 28px);
    height: 0.5px;
    background: var(--border-tertiary);
  }
  .or-between-groups::before { left: 0; }
  .or-between-groups::after  { right: 0; }

  .group {
    background: var(--bg-card);
    box-shadow: 0px 0.7226247621292714px 0.7226247621292714px -1.5px rgba(0, 0, 0, 0.21), 0px 2.7462399638921484px 2.7462399638921484px -3px rgba(0, 0, 0, 0.18), 0px 12px 12px -4.5px rgba(0, 0, 0, 0.02), 0px 0px 0px 1px rgba(0, 0, 0, 0.05);
    border-radius: var(--radius-xl);
    padding: 22px;
  }

  .group-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text-tertiary);
    margin: 0 0 14px 6px;
  }

  /* ─── CONDITION (one row inside a group) ─────────────────────── */
  .condition {
    background: var(--bg-page);
    border-radius: var(--radius-lg);
    box-shadow: 0px 0.7226247621292714px 0.7226247621292714px -1.5px rgba(0, 0, 0, 0.21), 0px 2.7462399638921484px 2.7462399638921484px -3px rgba(0, 0, 0, 0.18), 0px 12px 12px -4.5px rgba(0, 0, 0, 0.02), 0px 0px 0px 1px rgba(0, 0, 0, 0.05);
    padding: 14px 16px;
    position: relative;
  }
  .condition + .condition { margin-top: 10px; }

  .condition-head {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding-right: 30px; /* space for × */
  }

  .verb-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 12px;
    background: var(--bg-pill);
    border: 1px solid rgba(33, 33, 33, 0.1);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    cursor: pointer;
    font-family: inherit;
    transition: background 0.1s;
    white-space: nowrap;
  }
  .verb-pill:hover { background: var(--bg-pill-hover); }
  .verb-pill .caret { display: flex; align-items: center; justify-content: center; width: 12px; height: 12px; color: var(--text-secondary); }
  .verb-pill .caret svg { width: 12px; height: 12px; }

  /* Read-only secondary pill (e.g. "Last 30 days", "In the last 14 days", "New York, USA") */
  .info-input {
    flex: 1;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-width: 180px;
    height: 32px;
    padding: 0 12px;
    background: var(--bg-chip);
    border: none;
    border-radius: 999px;
    font-size: 14px;
    color: var(--text-primary);
    font-family: inherit;
    outline: none;
    transition: background 0.1s;
  }
  .info-input:hover { background: var(--bg-chip-hover); }
  .info-input:focus { background: var(--bg-chip-hover); }
  .info-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 12px;
    background: var(--bg-chip);
    border-radius: 999px;
    font-size: 13px;
    color: var(--text-primary);
    cursor: pointer;
    transition: background 0.1s;
  }
  .info-pill:hover { background: var(--bg-chip-hover); }
  .info-pill .caret { display: flex; align-items: center; justify-content: center; width: 12px; height: 12px; color: var(--text-secondary); margin-left: 4px; }
  .info-pill .caret svg { width: 12px; height: 12px; }

  .condition-x {
    position: absolute;
    top: 16px;
    right: 14px;
    width: 24px;
    height: 24px;
    border: none;
    background: transparent;
    color: var(--text-tertiary);
    cursor: pointer;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: background 0.1s, color 0.1s;
  }
  .condition-x:hover { background: rgba(0, 0, 0, 0.05); color: var(--text-primary); }
  .condition-x svg { width: 12px; height: 12px; }

  .chips-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  /* ─── CHIPS ──────────────────────────────────────────────────── */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 12px 0 4px;
    background: var(--bg-chip);
    border-radius: 999px;
    font-size: 13px;
    color: var(--text-primary);
    cursor: pointer;
    transition: background 0.1s, box-shadow 0.1s;
  }
  .chip:hover { 
    background: var(--bg-chip-hover);
  }
  .chip .handle { font-weight: 500; }
  .chip-x {
    width: 16px;
    height: 16px;
    border: none;
    background: transparent;
    color: var(--text-tertiary);
    cursor: pointer;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin-left: 2px;
    transition: background 0.1s, color 0.1s;
  }
  .chip-x:hover { background: rgba(0, 0, 0, 0.06); color: var(--text-primary); }
  .chip-x svg { width: 12px; height: 12px; }

  .add-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 14px 0 12px;
    background: transparent;
    border: 0.5px dashed var(--border-secondary);
    border-radius: 999px;
    color: var(--text-tertiary);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.1s, color 0.1s, border-style 0.1s;
  }
  .add-chip:hover {
    background: var(--bg-chip);
    color: var(--text-primary);
    border-style: solid;
  }

  /* Avatar styles */
  .avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    flex-shrink: 0;
    background: #000;
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 700;
    object-fit: cover;
    overflow: hidden;
  }
  .avatar-photo {
    display: block;
  }
  .avatar-mono {
    background: #000;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 9px;
    line-height: 1;
    letter-spacing: 0;
    text-transform: uppercase;
    padding: 0 3px;
  }
  .avatar-hash {
    background: transparent;
    color: var(--text-primary);
    font-size: 16px;
    font-weight: 400;
  }

  /* ─── BOTTOM ACTIONS (AND / OR) ──────────────────────────────── */
  .group-actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .action-btn {
    display: inline-flex;
    padding: 4px 8px;
    justify-content: center;
    align-items: center;
    gap: 4px;
    border-radius: 8px;
    background: #FFF;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.10), 0 1px 2px 0 rgba(0, 0, 0, 0.10);
    color: #212121;
    font-feature-settings: 'salt' on;
    font-family: Inter;
    font-size: 12px;
    font-style: normal;
    font-weight: 600;
    line-height: 16px;
    letter-spacing: -0.06px;
    cursor: pointer;
    border: none;
    transition: background 0.1s, box-shadow 0.1s;
  }
  .action-btn:hover { 
    background: #F5F5F5;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.12), 0 2px 4px 0 rgba(0, 0, 0, 0.12);
  }
  .action-btn svg { width: 12px; height: 12px; }

  /* ─── RIGHT-SIDE PANEL ───────────────────────────────────────── */
  .reach-card {
    background: var(--bg-card);
    border-radius: var(--radius-xl);
    padding: 28px 24px 24px;
    text-align: center;
  }
  .reach-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text-tertiary);
    margin: 0 0 12px;
  }
  .reach-number {
    font-size: 52px;
    font-weight: 500;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .reach-sub {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 22px;
  }
  .configure-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 48px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.1s;
  }
  .configure-btn:hover { background: var(--accent-hover); }

  /* ─── INLINE EDITOR (popover) ────────────────────────────────── */
  .editor {
    position: absolute;
    background: var(--bg-page);
    border: 0.5px solid var(--border-secondary);
    border-radius: var(--radius-md);
    padding: 6px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.10);
    z-index: 100;
    min-width: 260px;
    max-width: 320px;
    max-height: 320px;
    overflow-y: auto;
  }
  .editor-search {
    width: 100%;
    border: none;
    outline: none;
    padding: 9px 11px;
    background: var(--bg-card);
    border-radius: var(--radius-sm);
    font-size: 13px;
    color: var(--text-primary);
    font-family: inherit;
    margin-bottom: 4px;
  }
  .editor-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 8px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    transition: background 0.1s;
  }
  .editor-option:hover { background: var(--bg-card); }
  .editor-option.disabled { opacity: 0.4; cursor: default; }
  .editor-option.disabled:hover { background: transparent; }
  .editor-option .ph { font-weight: 500; }
  .editor-option .sb { font-size: 11px; color: var(--text-tertiary); }
  .editor-option .check { margin-left: auto; color: var(--accent); font-size: 14px; }
</style>
</head>

<div class="app">

  <!-- ════ LEFT NAV ════ -->
  <aside class="nav">
    <div class="nav-logo">
      <span class="logo-mark">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 22 C 6 12, 14 6, 20 8 C 26 10, 28 18, 22 22 C 18 24, 14 22, 12 18" />
        </svg>
      </span>
      <span>howdy</span>
    </div>

    <div class="nav-list">
      <a class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/>

        <span class="label">Lists</span>

      <a class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 10v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/><path d="M12 4v12"/><path d="m7 9 5-5 5 5"/>
        </svg>
        <span class="label">Campaigns</span>
      </a>
      <a class="nav-item active">

          <circle cx="10" cy="8" r="3"/><path d="M4 19c0-3 3-5 6-5s6 2 6 5"/><circle cx="17" cy="15" r="3.5"/><path d="m20 18 2.5 2.5"/>
        </svg>
        <span class="label">Search</span>
      </a>
      <a class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="12" r="4"/><circle cx="15" cy="12" r="4"/>
        </svg>
        <span class="label">Credits</span>
        <span class="badge">20</span>
      </a>
      <a class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2.4" fill="currentColor"/>
          <line x1="4" y1="17" x2="20" y2="17"/><circle cx="15" cy="17" r="2.4" fill="currentColor"/>
        </svg>
        <span class="label">Settings</span>
      </a>

      <div style="height: 12px;"></div>

      <a class="nav-extension">
        <span class="chrome-icon"></span>
        <span class="label">Download Extension</span>
      </a>
    </div>

    <div class="nav-footer">
      <span class="avatar-circle">B</span>
      <span class="name">Brandon</span>
      <span class="chev">▾</span>
    </div>
  </aside>

  <!-- ════ MAIN ════ -->
  <main class="main">
    <div class="topbar">Search for leads</div>

    <div class="workarea">
      <div class="builder">
        <div class="groups" id="groups"></div>
      </div>

      <div class="side">
        <div class="reach-card">
          <p class="reach-label">REACHABLE ACCOUNTS</p>
          <p class="reach-number" id="reach-number">—</p>
          <p class="reach-sub" id="reach-sub">Add conditions to see audience size</p>
          <button class="configure-btn">Configure Campaign</button>
        </div>
      </div>
    </div>
  </main>
</div>

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  let activeEditor = null;
  const groupsEl = document.getElementById('groups');
  const reachNumEl = document.getElementById('reach-number');
  const reachSubEl = document.getElementById('reach-sub');

  // ─── AVATAR ──────────────────────────────────────────────────
  const AVATAR_BASE = 'avatars';

  function avatarHTML(p) {
    if (!p) return '';
    if (p.type === 'hash') {
      return `<span class="avatar avatar-hash">#</span>`;
    }
    if (p.type === 'photo') {
      const imgSrc = `${AVATAR_BASE}/${p.handle}.jpg`;
      return `<img class="avatar avatar-photo" src="${imgSrc}" alt="" />`;
    }
    // mono: black circle with short caps
    return `<span class="avatar avatar-mono">${esc(p.short || p.handle.substring(0, 2).toUpperCase())}</span>`;
  }

  // ─── RENDER ──────────────────────────────────────────────────
  function render() {
    groupsEl.innerHTML = groups.map((g, gIdx) => renderGroup(g, gIdx, gIdx === groups.length - 1)).join(
      `<div class="or-between-groups">OR</div>`
    );
    updateReach();
  }

  function renderGroup(g, idx, isLast) {
    const conds = g.conditions.map(c => renderCondition(g.id, c)).join('');
    return `
      <div class="group" data-group-id="${g.id}">
        <div class="group-label">GROUP ${idx + 1}</div>
        ${conds}
        <div class="group-actions">
          <button class="action-btn" data-action="add-condition" data-group-id="${g.id}">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><g clip-path="url(#clip0_6287_983)"><path d="M6 0.5C6.414 0.5 6.75 0.836 6.75 1.25V5.25H10.75C11.164 5.25 11.5 5.586 11.5 6C11.5 6.414 11.164 6.75 10.75 6.75H6.75V10.75C6.75 11.164 6.414 11.5 6 11.5C5.586 11.5 5.25 11.164 5.25 10.75V6.75H1.25C0.836 6.75 0.5 6.414 0.5 6C0.5 5.586 0.836 5.25 1.25 5.25H5.25V1.25C5.25 0.836 5.586 0.5 6 0.5Z" fill="currentColor"/></g><defs><clipPath id="clip0_6287_983"><rect width="12" height="12" fill="white"/></clipPath></defs></svg><span>AND</span>
          </button>
          ${isLast ? `
            <button class="action-btn" data-action="add-or-group">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><g clip-path="url(#clip0_6287_983)"><path d="M6 0.5C6.414 0.5 6.75 0.836 6.75 1.25V5.25H10.75C11.164 5.25 11.5 5.586 11.5 6C11.5 6.414 11.164 6.75 10.75 6.75H6.75V10.75C6.75 11.164 6.414 11.5 6 11.5C5.586 11.5 5.25 11.164 5.25 10.75V6.75H1.25C0.836 6.75 0.5 6.414 0.5 6C0.5 5.586 0.836 5.25 1.25 5.25H5.25V1.25C5.25 0.836 5.586 0.5 6 0.5Z" fill="currentColor"/></g><defs><clipPath id="clip0_6287_983"><rect width="12" height="12" fill="white"/></clipPath></defs></svg><span>OR</span>
            </button>` : ''}
        </div>
      </div>
    `;
  }

  function renderCondition(groupId, c) {
    const verb = findVerb(c.verb);
    const verbHTML = `
      <button class="verb-pill" data-action="edit-verb" data-group-id="${groupId}" data-cond-id="${c.id}">
        <span>${esc(verb.label)}</span>
        <span class="caret"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9.71967 3.71967C10.0126 3.42678 10.4873 3.42678 10.7802 3.71967C11.0731 4.01256 11.0731 4.48732 10.7802 4.78022L6.53022 9.03022C6.23732 9.32311 5.76256 9.32311 5.46967 9.03022L1.21967 4.78022C0.926777 4.48732 0.926777 4.01256 1.21967 3.71967C1.51256 3.42678 1.98732 3.42678 2.28022 3.71967L5.99994 7.4394L9.71967 3.71967Z" fill="currentColor"/></svg></span>
      </button>
    `;

    // Build the head content based on verb type
    let headExtras = '';
    if (verb.input === 'location') {
      headExtras = `<input class="info-input" data-action="edit-location" data-group-id="${groupId}" data-cond-id="${c.id}" value="${esc(c.location || '')}" placeholder="City, Country" />`;
    } else if (verb.modifier === 'time') {
      headExtras = `<span class="info-pill" data-action="edit-time" data-group-id="${groupId}" data-cond-id="${c.id}">
        <span>${esc(c.time || TIME_OPTIONS[2])}</span>
        <span class="caret"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9.71967 3.71967C10.0126 3.42678 10.4873 3.42678 10.7802 3.71967C11.0731 4.01256 11.0731 4.48732 10.7802 4.78022L6.53022 9.03022C6.23732 9.32311 5.76256 9.32311 5.46967 9.03022L1.21967 4.78022C0.926777 4.48732 0.926777 4.01256 1.21967 3.71967C1.51256 3.42678 1.98732 3.42678 2.28022 3.71967L5.99994 7.4394L9.71967 3.71967Z" fill="currentColor"/></svg></span>
      </span>`;
    } else if (verb.modifier === 'range') {
      headExtras = `<span class="info-pill" data-action="edit-range" data-group-id="${groupId}" data-cond-id="${c.id}">
        <span>${esc(c.range || RANGE_OPTIONS[1])}</span>
        <span class="caret"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9.71967 3.71967C10.0126 3.42678 10.4873 3.42678 10.7802 3.71967C11.0731 4.01256 11.0731 4.48732 10.7802 4.78022L6.53022 9.03022C6.23732 9.32311 5.76256 9.32311 5.46967 9.03022L1.21967 4.78022C0.926777 4.48732 0.926777 4.01256 1.21967 3.71967C1.51256 3.42678 1.98732 3.42678 2.28022 3.71967L5.99994 7.4394L9.71967 3.71967Z" fill="currentColor"/></svg></span>
      </span>`;
    }

    // Chips row (only for chip-input verbs)
    let chipsHTML = '';
    if (verb.input === 'chips') {
      const chips = (c.targets || []).map(t => `
        <span class="chip" data-action="edit-chip" data-group-id="${groupId}" data-cond-id="${c.id}" data-handle="${esc(t.handle)}">
          ${avatarHTML(t)}
          <span class="handle">${esc(t.handle)}</span>
          <button class="chip-x" data-action="remove-chip" data-group-id="${groupId}" data-cond-id="${c.id}" data-handle="${esc(t.handle)}" aria-label="Remove"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1.71962 1.71767C2.01254 1.42476 2.48715 1.42492 2.78017 1.71767L5.9999 4.9374L9.21962 1.71962C9.51254 1.42671 9.98715 1.42688 10.2802 1.71962C10.5732 2.01263 10.5732 2.48717 10.2802 2.78017L7.06142 5.99892L10.2802 9.21767C10.5732 9.51067 10.5732 9.98522 10.2802 10.2782C10.1342 10.4242 9.9428 10.4989 9.75088 10.4989C9.55888 10.4989 9.36562 10.4252 9.21962 10.2782L6.00087 7.05947L2.78017 10.2802C2.63423 10.4261 2.4428 10.5008 2.25087 10.5009L2.2499 10.4999C2.0579 10.4999 1.86562 10.4262 1.71962 10.2792C1.42687 9.98618 1.42672 9.51157 1.71962 9.21865L4.93935 5.99795L1.71962 2.77822C1.42688 2.4852 1.42671 2.01059 1.71962 1.71767Z" fill="currentColor"/></svg></button>
        </span>
      `).join('');
      chipsHTML = `
        <div class="chips-row">
          ${chips}
          <button class="add-chip" data-action="add-chip" data-group-id="${groupId}" data-cond-id="${c.id}">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><g clip-path="url(#clip0_6287_983)"><path d="M6 0.5C6.414 0.5 6.75 0.836 6.75 1.25V5.25H10.75C11.164 5.25 11.5 5.586 11.5 6C11.5 6.414 11.164 6.75 10.75 6.75H6.75V10.75C6.75 11.164 6.414 11.5 6 11.5C5.586 11.5 5.25 11.164 5.25 10.75V6.75H1.25C0.836 6.75 0.5 6.414 0.5 6C0.5 5.586 0.836 5.25 1.25 5.25H5.25V1.25C5.25 0.836 5.586 0.5 6 0.5Z" fill="currentColor"/></g><defs><clipPath id="clip0_6287_983"><rect width="12" height="12" fill="white"/></clipPath></defs></svg><span>add</span>
          </button>
        </div>
      `;
    }

    return `
      <div class="condition" data-cond-id="${c.id}">
        <div class="condition-head">
          ${verbHTML}
          ${headExtras}
        </div>
        ${chipsHTML}
        <button class="condition-x" data-action="remove-condition" data-group-id="${groupId}" data-cond-id="${c.id}" aria-label="Remove"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1.71962 1.71767C2.01254 1.42476 2.48715 1.42492 2.78017 1.71767L5.9999 4.9374L9.21962 1.71962C9.51254 1.42671 9.98715 1.42688 10.2802 1.71962C10.5732 2.01263 10.5732 2.48717 10.2802 2.78017L7.06142 5.99892L10.2802 9.21767C10.5732 9.51067 10.5732 9.98522 10.2802 10.2782C10.1342 10.4242 9.9428 10.4989 9.75088 10.4989C9.55888 10.4989 9.36562 10.4252 9.21962 10.2782L6.00087 7.05947L2.78017 10.2802C2.63423 10.4261 2.4428 10.5008 2.25087 10.5009L2.2499 10.4999C2.0579 10.4999 1.86562 10.4262 1.71962 10.2792C1.42687 9.98618 1.42672 9.51157 1.71962 9.21865L4.93935 5.99795L1.71962 2.77822C1.42688 2.4852 1.42671 2.01059 1.71962 1.71767Z" fill="currentColor"/></svg></button>
      </div>
    `;
  }

  // ─── REACH NUMBER ────────────────────────────────────────────
  let currentNum = 0;
  let animFrame = null;
  function animateNumberTo(target) {
    if (animFrame) cancelAnimationFrame(animFrame);
    if (target === null) {
      currentNum = 0;
      reachNumEl.textContent = '—';
      return;
    }
    const start = currentNum;
    const t0 = performance.now();
    const ease = t => 1 - Math.pow(1 - t, 3);
    function tick(now) {
      const p = Math.min(1, (now - t0) / 600);
      const eased = ease(p);
      const jitter = (1 - p) * Math.abs(target - start) * 0.08 * (Math.random() - 0.5);
      const v = Math.max(0, Math.round(start + (target - start) * eased + jitter));
      reachNumEl.textContent = v.toLocaleString();
      if (p < 1) animFrame = requestAnimationFrame(tick);
      else { reachNumEl.textContent = target.toLocaleString(); currentNum = target; animFrame = null; }
    }
    animFrame = requestAnimationFrame(tick);
  }

  function updateReach() {
    const validGroups = groups.filter(g => g.conditions.length && g.conditions.every(c => {
      const verb = findVerb(c.verb);
      if (verb.input === 'chips') return c.targets && c.targets.length > 0;
      if (verb.input === 'location') return c.location && c.location.trim();
      return true; // info-only verbs (active, follower count) always valid
    }));

    if (validGroups.length === 0) {
      animateNumberTo(null);
      reachSubEl.textContent = 'Add conditions to see audience size';
      return;
    }

    let total = 0;
    validGroups.forEach(g => {
      let cnt = 0;
      g.conditions.forEach((c, i) => {
        const verb = findVerb(c.verb);
        let contribution;
        if (verb.input === 'chips') {
          const sum = c.targets.reduce((acc, t) => acc + (t.weight || 0.8), 0);
          const damped = sum * Math.pow(0.78, Math.max(0, c.targets.length - 1));
          contribution = 240000 * damped * verb.mult;
        } else if (verb.input === 'location') {
          contribution = 18000000 * verb.mult;
        } else {
          contribution = 240000 * verb.mult;
        }
        if (i === 0) cnt = contribution;
        else cnt = cnt * 0.42 * verb.mult;
      });
      total += cnt * 0.85;
    });
    total = Math.max(1, Math.round(total));
    animateNumberTo(total);
    const word = total > 500000 ? 'massive'
              : total > 100000 ? 'strong'
              : total > 15000  ? 'strong'
              : total > 3000   ? 'focused'
              : 'niche';
    reachSubEl.textContent = `A ${word} audience matching your criteria`;
  }

  // ─── EDITOR POPOVERS ─────────────────────────────────────────
  function closeEditor() {
    if (activeEditor) { activeEditor.remove(); activeEditor = null; }
  }

  function positionEditor(editor, anchor) {
    editor.style.visibility = 'hidden';
    document.body.appendChild(editor);
    const r = anchor.getBoundingClientRect();
    let left = r.left;
    if (left + 280 > window.innerWidth - 16) left = window.innerWidth - 296;
    editor.style.left = Math.max(8, left) + 'px';
    editor.style.top = (r.bottom + window.scrollY + 6) + 'px';
    editor.style.visibility = 'visible';
  }

  function openVerbEditor(anchor, groupId, condId) {
    closeEditor();
    const cond = findCond(groupId, condId);
    if (!cond) return;
    const ed = document.createElement('div');
    ed.className = 'editor';
    ed.innerHTML = VERBS.map(v => `
      <div class="editor-option" data-value="${v.id}">
        <span style="flex:1;">${esc(v.label)}</span>
        ${v.id === cond.verb ? '<span class="check">✓</span>' : ''}
      </div>`).join('');
    ed.addEventListener('click', e => {
      const opt = e.target.closest('.editor-option');
      if (!opt) return;
      const newVerb = opt.dataset.value;
      cond.verb = newVerb;
      // Clear incompatible state when switching verb input type
      const nv = findVerb(newVerb);
      if (nv.input !== 'chips') { cond.targets = []; }
      if (nv.input !== 'location') { delete cond.location; }
      if (nv.modifier === 'time' && !cond.time) cond.time = TIME_OPTIONS[2];
      if (nv.modifier === 'range' && !cond.range) cond.range = RANGE_OPTIONS[1];
      closeEditor(); render();
    });
    positionEditor(ed, anchor);
    activeEditor = ed;
  }

  function openListEditor(anchor, options, currentValue, onPick) {
    closeEditor();
    const ed = document.createElement('div');
    ed.className = 'editor';
    ed.innerHTML = options.map(o => `
      <div class="editor-option" data-value="${esc(o)}">
        <span style="flex:1;">${esc(o)}</span>
        ${o === currentValue ? '<span class="check">✓</span>' : ''}
      </div>`).join('');
    ed.addEventListener('click', e => {
      const opt = e.target.closest('.editor-option');
      if (!opt) return;
      onPick(opt.dataset.value);
      closeEditor(); render();
    });
    positionEditor(ed, anchor);
    activeEditor = ed;
  }

  function openTargetEditor(anchor, groupId, condId, replacingHandle) {
    closeEditor();
    const cond = findCond(groupId, condId);
    if (!cond) return;
    const ed = document.createElement('div');
    ed.className = 'editor';
    ed.innerHTML = `
      <input type="text" class="editor-search" placeholder="Search @people or #hashtags…" />
      <div class="editor-list"></div>
    `;
    const search = ed.querySelector('.editor-search');
    const list = ed.querySelector('.editor-list');

    function renderList(filter = '') {
      const f = filter.toLowerCase().trim();
      if (!f) {
        list.innerHTML = `<div style="padding:12px;text-align:center;font-size:12px;color:var(--text-tertiary);">Start typing to search</div>`;
        return;
      }
      const matches = PEOPLE.filter(p =>
        p.handle.toLowerCase().includes(f) || p.name.toLowerCase().includes(f)
      ).slice(0, 10);
      if (matches.length === 0) {
        list.innerHTML = `<div style="padding:12px;text-align:center;font-size:12px;color:var(--text-tertiary);">No matches</div>`;
        return;
      }
      list.innerHTML = matches.map(p => {
        const inRow = cond.targets.some(t => t.handle === p.handle && t.handle !== replacingHandle);
        const isCurrent = p.handle === replacingHandle;
        return `
          <div class="editor-option ${inRow ? 'disabled' : ''}" data-handle="${esc(p.handle)}">
            ${avatarHTML(p)}
            <span style="display:flex;flex-direction:column;min-width:0;">
              <span class="ph">${esc(p.name)}</span>
              <span class="sb">@${esc(p.handle)}</span>
            </span>
            ${isCurrent ? '<span class="check">✓</span>' : ''}
          </div>`;
      }).join('');
    }

    renderList();
    search.addEventListener('input', () => renderList(search.value));
    setTimeout(() => search.focus(), 30);

    list.addEventListener('click', e => {
      const opt = e.target.closest('.editor-option');
      if (!opt || opt.classList.contains('disabled')) return;
      const picked = PEOPLE.find(p => p.handle === opt.dataset.handle);
      if (!picked) return;
      if (replacingHandle) {
        const idx = cond.targets.findIndex(t => t.handle === replacingHandle);
        if (idx >= 0) cond.targets[idx] = picked;
        closeEditor(); render();
      } else {
        if (!cond.targets.some(t => t.handle === picked.handle)) cond.targets.push(picked);
        render();
        // Keep editor open for multi-add
        const newAnchor = groupsEl.querySelector(`[data-action="add-chip"][data-cond-id="${condId}"]`);
        if (newAnchor) openTargetEditor(newAnchor, groupId, condId);
        else closeEditor();
      }
    });

    positionEditor(ed, anchor);
    activeEditor = ed;
  }

  function findCond(groupId, condId) {
    const g = groups.find(g => g.id === groupId);
    return g?.conditions.find(c => c.id === condId);
  }

  // ─── EVENT WIRING ────────────────────────────────────────────
  groupsEl.addEventListener('click', e => {
    const t = e.target.closest('[data-action]');
    if (!t) return;
    e.stopPropagation();
    const action = t.dataset.action;
    const groupId = t.dataset.groupId;
    const condId = t.dataset.condId;
    const handle = t.dataset.handle;

    if (action === 'edit-verb')         openVerbEditor(t, groupId, condId);
    else if (action === 'edit-chip')    openTargetEditor(t, groupId, condId, handle);
    else if (action === 'add-chip')     openTargetEditor(t, groupId, condId);
    else if (action === 'edit-time') {
      const cond = findCond(groupId, condId);
      openListEditor(t, TIME_OPTIONS, cond?.time, v => { cond.time = v; });
    }
    else if (action === 'edit-range') {
      const cond = findCond(groupId, condId);
      openListEditor(t, RANGE_OPTIONS, cond?.range, v => { cond.range = v; });
    }
    else if (action === 'remove-chip') {
      const cond = findCond(groupId, condId);
      if (cond) { cond.targets = cond.targets.filter(x => x.handle !== handle); closeEditor(); render(); }
    }
    else if (action === 'add-condition') {
      const g = groups.find(g => g.id === groupId);
      if (g) {
        const c = { id: rid(), verb: 'follows', targets: [] };
        g.conditions.push(c); render();
        setTimeout(() => {
          const a = groupsEl.querySelector(`[data-action="edit-verb"][data-cond-id="${c.id}"]`);
          if (a) openVerbEditor(a, g.id, c.id);
        }, 30);
      }
    }
    else if (action === 'remove-condition') {
      const g = groups.find(g => g.id === groupId);
      if (g) {
        g.conditions = g.conditions.filter(c => c.id !== condId);
        if (g.conditions.length === 0) {
          // If we emptied the group, drop the whole group (unless it's the only one)
          if (groups.length > 1) groups = groups.filter(x => x.id !== g.id);
          else g.conditions.push({ id: rid(), verb: 'follows', targets: [] });
        }
        closeEditor(); render();
      }
    }
    else if (action === 'add-or-group') {
      const ng = { id: gid(), conditions: [ { id: rid(), verb: 'follows', targets: [] } ] };
      groups.push(ng); render();
      setTimeout(() => {
        const a = groupsEl.querySelector(`[data-action="edit-verb"][data-cond-id="${ng.conditions[0].id}"]`);
        if (a) openVerbEditor(a, ng.id, ng.conditions[0].id);
      }, 30);
    }
  });

  // Inputs (the location text field)
  groupsEl.addEventListener('input', e => {
    const t = e.target.closest('[data-action="edit-location"]');
    if (!t) return;
    const cond = findCond(t.dataset.groupId, t.dataset.condId);
    if (cond) { cond.location = t.value; updateReach(); }
  });

  document.addEventListener('click', e => {
    if (activeEditor && !activeEditor.contains(e.target) && !e.target.closest('[data-action]')) {
      closeEditor();
    }
  });

  // ─── INIT ────────────────────────────────────────────────────
  render();
})();
</script>
